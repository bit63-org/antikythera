#
# Pull-request and main-branch CI. Toolchains and libraries come from the
# Ubuntu archive (system Boost 1.83, OpenSSL 3.0), the same set
# .claude/hooks/session-start.sh installs, so no vcpkg bootstrap.
#
# Runners: the repository variable AK_SELF_HOSTED_RUNNER names the
# self-hosted ARC runner scale set (reliant-arc, on reliant-new) the jobs
# run on. Unset, every job falls back to GitHub-hosted ubuntu-24.04. The
# repository is public, so pull requests from forks always get the hosted
# runner: their code never runs on the LAN.
#
# Build cache: on the self-hosted runner, sccache stores objects in the
# kythira-cache cluster on reliant-new through its Redis (RESP) port.
# AK_BUILD_CACHE_REDIS is the endpoint (redis://host:port); the
# KYTHIRA_CACHE_RW_* secrets (ACL user ci-main) are used for pushes to
# main and KYTHIRA_CACHE_PR_* (ci-pr) for everything else. Missing
# settings, or a cache that does not answer, build without a launcher.
#
# Job names are the check names main's branch protection requires:
#   build (gcc-14)     GCC 14 Debug build + ctest
#   build (clang-19)   Clang 19 Debug + ASan/UBSan + libFuzzer build, ctest,
#                      and a short smoke run of every fuzz target
#   lint               clang-format, clang-tidy, shellcheck
#   kernel-interop     in kernel-interop.yml: it needs a GitHub-hosted VM, and
#                      a separate workflow keeps its queue wait out of this
#                      workflow's concurrency group
#   kernel-config      resolves the hull and harbor L1 kernel fragments
#                      against a real kernel tree, checks the result and
#                      builds the strict kernel (about two minutes; not
#                      yet a required check)

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_GENERATOR: Ninja
  # Pinned to match .claude/hooks/session-start.sh; .clang-format uses
  # options newer than Ubuntu's clang-format-19.
  CLANG_FORMAT_VERSION: "22.1.5"
  SCCACHE_VERSION: "0.10.0"
  SCCACHE_SHA256: "1fbb35e135660d04a2d5e42b59c7874d39b3deb17de56330b25b713ec59f849b"
  # Self-hosted runner for this run, or empty for GitHub-hosted. Fork pull
  # requests never get it.
  AK_RUNNER: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.AK_SELF_HOSTED_RUNNER || '' }}

jobs:
  build:
    name: build (${{ matrix.compiler }})
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.AK_SELF_HOSTED_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-14
            cxx: g++-14
            packages: g++-14
            cmake_flags: ""
          - compiler: clang-19
            cxx: clang++-19
            # libstdc++-14-dev: clang uses the newest GCC's libstdc++ it
            # finds, and the ARC runner image ships only GCC 13, whose
            # libstdc++ has no <print>. Hosted images carry 14 already.
            packages: clang-19 libclang-rt-19-dev libstdc++-14-dev
            cmake_flags: -DAK_SANITIZE=ON -DAK_FUZZ=ON
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ${{ matrix.packages }} cmake ninja-build libboost-test-dev libssl-dev

      # sccache against kythira-cache, self-hosted runner only. Any missing
      # setting or a failed server start leaves the launcher at none.
      - name: Start sccache
        id: sccache
        env:
          SELF_HOSTED: ${{ env.AK_RUNNER != '' }}
          SCCACHE_REDIS_ENDPOINT: ${{ vars.AK_BUILD_CACHE_REDIS }}
          SCCACHE_REDIS_USERNAME: ${{ github.ref == 'refs/heads/main' && secrets.KYTHIRA_CACHE_RW_USER || secrets.KYTHIRA_CACHE_PR_USER }}
          SCCACHE_REDIS_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.KYTHIRA_CACHE_RW_PASSWORD || secrets.KYTHIRA_CACHE_PR_PASSWORD }}
          # kythira-cache's ACL grants the CI users the sccache/ key prefix.
          SCCACHE_REDIS_KEY_PREFIX: sccache/
          SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
        run: |
          launcher=none
          if [ "$SELF_HOSTED" = true ] && [ -n "$SCCACHE_REDIS_ENDPOINT" ] \
             && [ -n "$SCCACHE_REDIS_USERNAME" ] && [ -n "$SCCACHE_REDIS_PASSWORD" ]; then
            name="sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl"
            curl -sSLfo "$RUNNER_TEMP/sccache.tgz" \
              "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/${name}.tar.gz"
            echo "${SCCACHE_SHA256}  $RUNNER_TEMP/sccache.tgz" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/sccache.tgz" -C "$RUNNER_TEMP"
            install -D -m 0755 "$RUNNER_TEMP/$name/sccache" "$RUNNER_TEMP/bin/sccache"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
            if "$RUNNER_TEMP/bin/sccache" --start-server; then
              launcher=sccache
            else
              echo "::warning::sccache did not start against kythira-cache; building without a cache"
            fi
          else
            echo "No self-hosted build cache for this run"
          fi
          echo "launcher=$launcher" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DAK_COMPILER_LAUNCHER=${{ steps.sccache.outputs.launcher }} \
            -DAK_VFIO_USER=OFF \
            ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

      - name: Fuzz smoke
        if: matrix.compiler == 'clang-19'
        run: |
          for f in build/fuzz/fuzz_*; do
            [ -x "$f" ] || continue
            echo "::group::$(basename "$f")"
            "$f" -max_total_time=20 -print_final_stats=1
            echo "::endgroup::"
          done

      - name: sccache statistics
        if: always() && steps.sccache.outputs.launcher == 'sccache'
        run: sccache --show-stats

  lint:
    name: lint
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.AK_SELF_HOSTED_RUNNER || 'ubuntu-24.04' }}
    # clang-tidy over the whole tree took 18.6 min on main at 5b76a07 and
    # timed out at 20 on PR #33; give it room to grow.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang-19 clang-tidy-19 libstdc++-14-dev cmake ninja-build libboost-test-dev libssl-dev shellcheck \
            python3-venv
          # A venv, not pip --user: the ARC runner image's Python is
          # externally managed (PEP 668) and has no pip of its own.
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/pip" install -q "clang-format==${CLANG_FORMAT_VERSION}"
          echo "$RUNNER_TEMP/clang-format/bin" >> "$GITHUB_PATH"

      - name: clang-format
        run: |
          clang-format --version
          git ls-files -z '*.cpp' '*.hpp' '*.h' '*.cc' \
            | xargs -0 clang-format --dry-run --Werror

      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      - name: clang-tidy
        run: |
          cmake -S . -B build-tidy \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DAK_COMPILER_LAUNCHER=none \
            -DAK_VFIO_USER=OFF
          # Only translation units in compile_commands.json: files behind a
          # disabled option (the vfio-user servers) have no compile command.
          run-clang-tidy-19 -p build-tidy -clang-tidy-binary clang-tidy-19 \
            -quiet "$PWD/(src|tests|fuzz)/"

  kernel-config:
    name: kernel-config
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.AK_SELF_HOSTED_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Ubuntu's linux-source package: signed by the archive, and the same
      # tree a cloud thread can install, so local and CI results match.
      - name: Install kernel source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            linux-source-6.8.0 flex bison bc libelf-dev libssl-dev bzip2 build-essential
          mkdir -p "$RUNNER_TEMP/linux"
          tar -xjf /usr/src/linux-source-6.8.0/linux-source-6.8.0.tar.bz2 \
            -C "$RUNNER_TEMP/linux" --strip-components=1

      - name: hull (strict), resolve and build
        run: harbor/kernel/build.sh --src "$RUNNER_TEMP/linux" --variant hull --build

      - name: l1-debug
        run: harbor/kernel/build.sh --src "$RUNNER_TEMP/linux" --variant l1-debug
